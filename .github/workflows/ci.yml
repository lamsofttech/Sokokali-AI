# Runs on every push and pull request: tests, type checks, security audits and Docker builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start the stack and check health
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/ready; then echo; break; fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:8080/ready | grep '"database":true'
          curl -fsS -X POST http://127.0.0.1:8080/api/v1/chat -H 'Content-Type: application/json' \
            -d '{"message":"Arsenal vs Chelsea who will win?"}' | grep '"intent":"prediction"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - name: Stop
        if: always()
        run: docker compose down -v
